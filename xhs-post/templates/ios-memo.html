<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ios-memo cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 中文只有思源黑/宋两个选择（Google Fonts 简中字体就这些）。
     西文可换：Inter / Michroma / Playwrite / Gothic A1 等，见 __LATIN_FONT__ -->
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@400;700;900&family=Inter:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="_base.css">
<style>
/* ios-memo 专有：✅ 条目列表与封面变体。共享部分见 _base.css */
.items{display:flex; flex-direction:column; gap:34px}
.item{display:flex; gap:22px; font-size:42px; line-height:1.55}
.item .tick{color:var(--accent); font-weight:700; flex:none}
.item b{font-weight:700}
.poster.cover .body{align-items:flex-start}
.big-num{font-size:280px; font-weight:900; line-height:.94; letter-spacing:-.04em}
.cover-sub{font-size:52px; font-weight:500; line-height:1.5; margin-top:36px}
.cover-note{font-size:38px; color:var(--ink-dim); margin-top:22px}
</style>
</head>
<body>
<!-- 数据由 render_cards.mjs 注入；直接双击本文件可看占位示例 -->
<script id="card-data" type="application/json">
{"latinFont":"Inter","cards":[
 {"type":"cover","bigNum":"5类人","sub":"占位封面","note":"用 --data 传入真实数据"},
 {"type":"card","kicker":"类型一","title":"占位标题","lead":"占位现象描述。","items":["占位条目"]}
]}
</script>
<script>
(function(){
  var d = JSON.parse(document.getElementById('card-data').textContent);
  if (d.latinFont) {
    document.documentElement.style.setProperty('--font-latin', "'" + d.latinFont + "'");
    var l = document.getElementById('fontlink');
    if (!l.href.includes(encodeURIComponent(d.latinFont).replace(/%20/g,'+')))
      l.href = l.href + '&family=' + d.latinFont.replace(/ /g,'+') + ':wght@400;500;700;900';
  }
  var esc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); };
  /* 页码由模板自动计算，**不读数据里的 page 字段**。
     手填过一次就会错一次（2026-08-19 实测：7 张卡的序号全填成了 /05）。 */
  var total = d.cards.filter(function(x){ return x.type !== 'cover'; }).length;
  var seq = 0;
  var html = d.cards.map(function(c){
    var cls = 'poster' + (c.serif ? ' serif' : '') + (c.type === 'cover' ? ' cover' : '');
    // 页脚只出页码。刻意不支持自定义文本 —— 素人账号不能有固定署名。
    var foot = '';
    if (c.type !== 'cover') {
      seq += 1;
      var pad = function(n){ return (n < 10 ? '0' : '') + n; };
      foot = '<div class="foot" data-qa-ignore><span></span><span>' +
             pad(seq) + ' / ' + pad(total) + '</span></div>';
    }
    if (c.type === 'cover')
      return '<section class="' + cls + '" id="' + esc(c.id || 'cover') + '"><div class="body">' +
        '<div class="big-num">' + esc(c.bigNum) + '</div>' +
        (c.sub ? '<div class="cover-sub">' + esc(c.sub) + '</div>' : '') +
        (c.note ? '<div class="cover-note">' + esc(c.note) + '</div>' : '') + '</div>' + foot + '</section>';
    var items = (c.items || []).map(function(t){
      return '<div class="item"><span class="tick">✓</span><span>' + esc(t) + '</span></div>';
    }).join('');
    return '<section class="' + cls + '" id="' + esc(c.id || '') + '"><div class="body">' +
      (c.kicker ? '<div class="kicker">' + esc(c.kicker) + '</div>' : '') +
      '<h1 class="title' + (String(c.title).length > 12 ? ' sm' : '') + '">' + esc(c.title) + '</h1>' +
      (c.lead ? '<p class="lead">' + esc(c.lead) + '</p>' : '') +
      (items ? '<div class="items">' + items + '</div>' : '') + '</div>' + foot + '</section>';
  }).join('');
  document.body.innerHTML = html;
})();
</script>
</body>
</html>
